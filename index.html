<style>
:root{
  /* Warna UniMAP: putih utama, biru dan kuning sebagai penyerlah. Tukar di sini sahaja. */
  --blue:#0B4EA2; --blue-d:#07356F; --blue-l:#EAF2FC; --blue-x:#CFE2F7;
  --yellow:#FFC20E; --yellow-d:#D29400; --yellow-l:#FFF6DB;
  --ink:#16233A; --mute:#68788E; --line:#E3EAF4; --white:#fff;
  --ok:#17A06B; --ok-l:#E3F7EF; --ok-x:#B9E8D4;
  --no:#E0483D; --no-l:#FDECEA; --no-x:#F7C9C5;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--white); color:var(--ink);
  font-family:Nunito,ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-weight:700; line-height:1.45; min-height:100vh;
}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:280px;z-index:-1;
  background:radial-gradient(130% 100% at 50% 0,var(--blue-l) 0,#fff 72%)}
.wrap{max-width:760px;margin:0 auto;padding:8px 16px 60px}
h1,h2,h3{margin:0;line-height:1.15}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* Butang tebal bergaya permainan */
.btn{border:0;border-radius:18px;padding:14px 24px;font-size:18px;font-weight:900;cursor:pointer;
  background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 var(--yellow-d);
  transition:transform .08s ease,box-shadow .08s ease;min-height:52px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--yellow-d)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
.btn.blue:active:not(:disabled){box-shadow:0 1px 0 var(--blue-d)}
.btn.ghost{background:#fff;color:var(--blue);box-shadow:0 0 0 2px var(--line) inset,0 3px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 2px var(--line) inset,0 1px 0 var(--line)}
.btn.sm{padding:9px 16px;font-size:14px;min-height:0;border-radius:14px}
.btn:disabled{opacity:.45;box-shadow:none;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}

/* Bar atas */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px 4px}
.me{display:flex;align-items:center;gap:9px;min-width:0}
.av{flex:0 0 38px;width:38px;height:38px;border-radius:50%;background:var(--yellow);color:var(--blue-d);
  display:grid;place-items:center;font-weight:900;font-size:17px}
.me b{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.help{display:flex;align-items:center;gap:7px}
.help span{font-size:12px;font-weight:800;color:var(--mute)}
.seg{display:inline-flex;background:var(--blue-l);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--blue-d);font-size:13px;font-weight:800;
  padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}

/* Bar kemajuan bersegmen */
.prog{display:flex;gap:5px;margin:14px 2px 16px}
.prog i{flex:1;height:10px;border-radius:999px;background:var(--line);transition:background .2s}
.prog i.done{background:var(--yellow)}
.prog i.bad{background:var(--no)}
.prog i.now{background:var(--blue)}

/* Kad soalan */
.qcard{background:var(--blue);color:#fff;border-radius:26px;padding:22px 20px;margin:2px 0 18px;
  box-shadow:0 12px 26px rgba(11,78,162,.22)}
.qcard .chip{display:inline-block;background:rgba(255,255,255,.2);font-size:13px;font-weight:900;
  padding:5px 13px;border-radius:999px}
.qcard .chip.retry{background:var(--yellow);color:var(--blue-d)}
.qcard .ask{font-size:16px;font-weight:700;opacity:.92;margin-top:12px}
.qcard .emoji{font-size:54px;line-height:1;margin-top:8px}
.qcard .big{font-size:clamp(32px,9vw,46px);font-weight:900;letter-spacing:-.02em;margin:8px 0 2px;
  line-height:1.1;overflow-wrap:anywhere}
.qcard .sub{font-size:17px;font-weight:700;opacity:.9}
.chipbtn{border:0;border-radius:999px;padding:9px 16px;font-size:15px;font-weight:800;cursor:pointer;
  background:#fff;color:var(--blue);box-shadow:0 3px 0 rgba(0,0,0,.14)}
.chipbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.chipbtn.soft{background:rgba(255,255,255,.18);color:#fff;box-shadow:none;font-weight:700}
.dlg{background:rgba(255,255,255,.14);border-radius:16px;padding:12px 14px;margin:14px 0 2px;font-size:16px}
.dlg p{margin:6px 0}
.dlg b{color:var(--yellow)}
#helptext:not(:empty){background:rgba(255,255,255,.14);border-radius:14px;padding:10px 13px;margin-top:10px;
  font-size:16px;font-weight:700}

/* Pilihan jawapan */
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);border-radius:18px;
  background:#fff;color:var(--ink);font-size:18px;font-weight:800;padding:15px 18px;margin:10px 0;
  min-height:58px;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:border-color .12s,box-shadow .12s}
.opt:hover:not(:disabled){border-color:var(--blue);box-shadow:0 3px 0 var(--blue-x)}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--blue-x)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-l);border-color:var(--ok);box-shadow:0 3px 0 var(--ok-x)}
.opt.no{background:var(--no-l);border-color:var(--no);box-shadow:0 3px 0 var(--no-x)}

input[type=text]{width:100%;font:inherit;font-weight:800;font-size:19px;padding:15px 18px;
  border:2px solid var(--line);border-radius:18px;background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
input[type=text]:focus{border-color:var(--blue);outline:none}
label{display:block;font-weight:800;font-size:15px;margin:14px 0 6px;color:var(--mute)}

.fb{border-radius:18px;padding:14px 16px;margin:14px 0;font-size:17px;font-weight:800}
.fb.ok{background:var(--ok-l);color:#0B6B47;box-shadow:0 3px 0 var(--ok-x)}
.fb.no{background:var(--no-l);color:#9C2A21;box-shadow:0 3px 0 var(--no-x)}

/* Susun ayat */
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:10px;border-radius:18px;
  background:var(--blue-l);margin:10px 0}
.tiles.pool{background:#fff;border:2px dashed var(--blue-x)}
.tile{border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);
  font-size:18px;font-weight:800;padding:9px 14px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

/* Kad topik */
.hero{margin:6px 2px 18px;display:flex;gap:14px;align-items:center}
.hero h1{font-size:clamp(25px,6.5vw,33px);font-weight:900;letter-spacing:-.02em}
.hero p{margin:5px 0 0;font-size:15px;font-weight:700;color:var(--mute)}
.topics{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:640px){.topics{grid-template-columns:1fr 1fr}}
.tcard{background:#fff;border:2px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 4px 0 var(--line)}
.tcard .head{display:flex;gap:12px;align-items:flex-start}
.tcard .ic{flex:0 0 54px;width:54px;height:54px;border-radius:18px;background:var(--blue-l);
  display:grid;place-items:center;font-size:28px}
.wk{display:inline-block;white-space:nowrap;font-size:11px;font-weight:900;color:var(--blue);background:var(--blue-l);
  padding:3px 9px;border-radius:999px;margin-bottom:5px;letter-spacing:.02em}
.tcard h3{font-size:18px;font-weight:900}
.tcard .rk{font-size:14px;font-weight:700;color:var(--mute);margin-top:5px}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.lv button{border:0;border-radius:15px;background:var(--blue-l);color:var(--blue-d);
  font-size:14px;font-weight:900;padding:9px 3px;cursor:pointer;box-shadow:0 3px 0 var(--blue-x)}
.lv button:hover{background:var(--yellow-l);box-shadow:0 3px 0 var(--yellow)}
.lv button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blue-x)}
.lv .st{display:block;font-size:13px;color:var(--yellow-d);letter-spacing:2px;min-height:17px;line-height:1}
.lv small{display:block;font-size:11px;font-weight:700;color:var(--mute)}
.note{font-size:13px;font-weight:700;color:var(--mute);margin:16px 2px;line-height:1.5}
.note.box{background:var(--blue-l);color:var(--blue-d);border-radius:18px;padding:13px 16px}

/* Skrin markah */
.score{text-align:center;padding:6px 0 2px}
.ring{width:160px;height:160px;margin:0 auto;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--yellow) calc(var(--p) * 3.6deg),var(--blue-l) 0)}
.ring b{width:126px;height:126px;border-radius:50%;background:#fff;display:grid;place-items:center;
  font-size:38px;font-weight:900;color:var(--blue-d)}
.stars{font-size:42px;letter-spacing:6px;color:var(--yellow);margin-top:12px;line-height:1}
.score p{margin:8px 0 0;font-size:16px;font-weight:700;color:var(--mute)}
.bar2{display:grid;grid-template-columns:72px 1fr 44px;gap:10px;align-items:center;margin:10px 2px;
  font-size:15px;font-weight:800}
.bar2 i{display:block;height:12px;border-radius:999px;background:var(--blue-l);overflow:hidden}
.bar2 i b{display:block;height:100%;background:var(--blue);border-radius:999px}
.bar2 em{font-style:normal;color:var(--mute);text-align:right}

@media (prefers-reduced-motion:no-preference){
  .qcard{animation:pop .3s cubic-bezier(.2,.9,.3,1.25)}
  @keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .stars{animation:bump .55s cubic-bezier(.2,.9,.3,1.5)}
  @keyframes bump{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1)}}
}

  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n]};
const overlap = (a,b)=>{const A=norm(a).split(' ').filter(Boolean),B=norm(b).split(' ').filter(Boolean);
  if(!A.length||!B.length)return 0;const pool=[...B];let hit=0;
  for(const w of A){const k=pool.indexOf(w);if(k>-1){hit++;pool.splice(k,1)}}
  return hit/Math.max(A.length,B.length)};

function pickVoice(){const v=voices();return v.find(x=>/^ms[-_]/i.test(x.lang))||v.find(x=>/^id[-_]/i.test(x.lang))||null}
function ttsOK(){if(!hasTTS)return false;const v=voices();return v.length===0||!!pickVoice()}

function distract(w,words,n){
  const same=words.filter(x=>x.bm!==w.bm&&x.g===w.g), other=words.filter(x=>x.bm!==w.bm&&x.g!==w.g);
  return shuffle(same).concat(shuffle(other)).slice(0,n);
}
function optsFor(w,words,fn){const arr=shuffle([w].concat(distract(w,words,3)));return{opts:arr.map(fn),a:arr.indexOf(w)}}
const ans = w=>[w.bm].concat(w.alt||[]);
const gap = s=>s.bm.replace(new RegExp('\\b'+s.cloze+'\\b','i'),'_____');

 'baca-fwd':(t,n)=>take(t.words,n).map(w=>{const o=optsFor(w,t.words,gloss);
   return{skill:'baca',type:'mcq',title:'Baca',prompt:'Apakah maksud perkataan ini?',big:w.bm,emoji:w.e,opts:o.opts,a:o.a,why:`${w.bm} = ${gloss(w)}`}}),
 'dengar-mcq':(t,n)=>take(t.words,n).map(w=>{const o=optsFor(w,t.words,x=>x.bm);
   return{skill:'dengar',type:'mcq',title:'Dengar',prompt:'Dengar, kemudian pilih perkataan yang betul.',audio:w.bm,opts:o.opts,a:o.a,why:w.bm,reveal:w.bm}}),
 'cakap-word':(t,n)=>take(t.words,n).map(w=>({skill:'cakap',type:'speak',title:'Cakap',prompt:'Tekan butang mikrofon, kemudian sebut perkataan ini.',big:w.bm,emoji:w.e,audio:w.bm,target:w.bm,alts:w.alt||[],word:true,help:gloss(w),
   fallback:{big:w.e?'':gloss(w),sub:w.e?gloss(w):'',emoji:w.e,answers:ans(w),prompt:'Tulis perkataan itu dalam Bahasa Melayu.'}})),
 'tulis-word':(t,n)=>take(t.words,n).map(w=>({skill:'tulis',type:'type',title:'Tulis',prompt:'Tulis perkataan ini dalam Bahasa Melayu.',big:w.e?'':gloss(w),sub:w.e?gloss(w):'',emoji:w.e,answers:ans(w)})),
 'dengar-type':(t,n)=>take(t.words,n).map(w=>({skill:'dengar',type:'type',title:'Dengar dan tulis',prompt:'Dengar, kemudian tulis perkataan itu.',audio:w.bm,answers:ans(w),reveal:w.bm,help:gloss(w)})),
 /* Tahap 2 dan 3: skrin Bahasa Melayu sahaja. Maksud di belakang butang. */
 'cloze':(t,n)=>take(t.sentences.filter(s=>s.cloze),n).map(s=>{const opts=shuffle(s.opts);
   return{skill:'baca',type:'mcq',title:'Baca',prompt:'Pilih perkataan yang sesuai.',big:gap(s),opts,a:opts.findIndex(o=>norm(o)===norm(s.cloze)),why:s.bm,help:glossS(s)}}),
 'khas':(t,n)=>take(t.soalan||[],n).map(x=>{const ai=x.opts.indexOf(x.a),sh=shuffle(x.opts.map((o,i)=>i));
   return{skill:x.skill||'baca',type:'mcq',title:x.title||'Tatabahasa',prompt:x.q,opts:sh.map(i=>x.opts[i]),a:sh.indexOf(ai),why:x.why||''}}),
 'order-audio':(t,n)=>take(t.sentences,n).map(s=>({skill:'tulis',type:'order',title:'Dengar dan susun',prompt:'Dengar ayat itu, kemudian susun perkataan.',audio:s.bm,tiles:shuffle(s.bm.replace(/[.?!,]/g,'').split(' ')),answer:s.bm,help:glossS(s)})),
 'order':(t,n)=>take(t.sentences,n).map(s=>({skill:'tulis',type:'order',title:'Susun ayat',prompt:'Susun perkataan menjadi ayat yang betul.',sub:glossS(s),tiles:shuffle(s.bm.replace(/[.?!,]/g,'').split(' ')),answer:s.bm})),
 'dialog':(t,n)=>{let all=[];shuffle(t.dialogues).forEach(d=>d.qs.forEach(q=>{const idx=q.opts.map((o,i)=>i),sh=shuffle(idx);
     all.push({skill:'baca',type:'mcq',title:'Baca perbualan',prompt:q.q,dialog:d.lines,opts:sh.map(i=>q.opts[i]),a:sh.indexOf(q.a),why:q.why||''})}));
   return all.slice(0,n)},
 'dengar-sent':(t,n)=>take(t.sentences,n).map(s=>({skill:'dengar',type:'type',title:'Dengar dan tulis',prompt:'Dengar, kemudian tulis ayat itu.',audio:s.bm,answers:[s.bm],sentence:true,fuzzy:true,reveal:s.bm,help:glossS(s)})),
 'cakap-sent':(t,n)=>take(t.sentences,n).map(s=>({skill:'cakap',type:'speak',title:'Cakap',prompt:'Tekan butang mikrofon, kemudian baca ayat ini.',big:s.bm,audio:s.bm,target:s.bm,sentence:true,help:glossS(s),
   fallback:{big:glossS(s),answers:[s.bm],sentence:true,fuzzy:true,prompt:'Tulis ayat ini dalam Bahasa Melayu.'}})),
 'tanya':(t,n)=>take(t.tanya||[],n).map(x=>({skill:'tulis',type:'type',title:'Jawab dalam Bahasa Melayu',prompt:x.q,dialog:x.lines,answers:x.a,short:true}))
};
const PLAN = {
  1:[['baca-fwd',3],['dengar-mcq',3],['tulis-word',2],['cakap-word',2]],
  2:[['tulis-word',3],['dengar-type',2],['cloze',1],['khas',1],['order-audio',1],['cakap-word',2]],
  3:[['dialog',3],['dengar-sent',2],['cakap-sent',3],['tanya',2]]
};
function remap(k){
  if(!hasSR){ if(k==='cakap-word')return'tulis-word'; if(k==='cakap-sent')return ttsOK()?'dengar-sent':'khas'; }
  if(!ttsOK()){ if(k==='dengar-mcq')return'baca-fwd'; if(k==='dengar-type')return'tulis-word'; if(k==='dengar-sent')return'tanya'; if(k==='order-audio')return'order'; }
  return k;
}
function dedup(qs){
  const seen=new Set();
  return qs.filter(q=>{const key=q.type+'|'+(q.big||'')+'|'+(q.audio||'')+'|'+q.prompt+'|'+(q.sub||'');
    if(seen.has(key))return false;seen.add(key);return true});
}
/* Jenis simpanan: dipakai apabila peranti tiada suara atau mikrofon, supaya tetap genap 10 soalan. */
const SPARE={1:['baca-fwd','tulis-word'],2:['khas','cloze','order','tulis-word'],3:['dialog','tanya','khas','cloze']};
function buildRound(t,level){
  const want=CFG.roundSize||10;
  let qs=[];
  for(const [k,n] of PLAN[level]) qs=qs.concat(B[remap(k)](t,n));
  qs=dedup(qs);
  let guard=0;
  while(qs.length<want && guard++<10){
    const before=qs.length;
    for(const k of SPARE[level]){ qs=dedup(qs.concat(B[remap(k)](t,2))); if(qs.length>=want) break; }
    if(qs.length===before) break;
  }
  return qs.slice(0,want);
}

function checkText(q){
  const raw=($('#ans').value||'').trim();if(!raw){return}
  const n=norm(raw);const targets=q.answers.map(norm);
  let ok=targets.includes(n),near=false;
  if(!ok&&q.short) ok=targets.some(t=>new RegExp('(^|\\s)'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|\\s)').test(n));
  if(!ok&&q.fuzzy){const best=Math.max(...q.answers.map(a=>overlap(raw,a)));if(best>=.8){ok=true;near=true}}
  const model=q.answers[0];
  $('#ans').disabled=true;

function listen(q){
  const btn=$('#micbtn'),out=$('#heard');
  let r;
  try{r=new SR()}catch(e){out.textContent='Mikrofon tidak dapat dibuka. Tekan Tukar kepada menulis.';return}
  r.lang='ms-MY';r.interimResults=false;r.maxAlternatives=3;
  let finished=false,timer=null;
  btn.disabled=true;out.textContent='Mendengar... sebut sekarang.';
  const end=(err,alts)=>{
    if(finished)return;finished=true;clearTimeout(timer);btn.disabled=false;
    if(err){
      if(err==='no-speech'||err==='aborted'){out.textContent='Tidak dengar apa-apa. Tekan butang mikrofon dan cuba lagi, atau tekan Tukar kepada menulis.';return}
      if(err==='timeout'){out.textContent='Mikrofon tidak memberi jawapan. Cuba sekali lagi, atau tekan Tukar kepada menulis.';return}
      toTyping(q);return;
    }
    const best=alts.map(a=>a.trim());
    let ok=false;
    for(const h of best)for(const t of [q.target].concat(q.alts||[])){
      const nh=norm(h),nt=norm(t);
      if(q.word){ if(nh.includes(nt)||(nt.indexOf(' ')<0&&nh.split(' ').some(w=>lev(w,nt)<=1)))ok=true }
      else if(overlap(h,t)>=.7)ok=true;
    }
    out.textContent='';
    finishAnswer(ok, ok?`Bagus! Dengar: <i>${esc(best[0])}</i>`:`Dengar: <i>${esc(best[0]||'-')}</i>. Sasaran: <b>${esc(q.target)}</b>. Tekan 🔊 untuk dengar contoh, kemudian cuba soalan seterusnya.`);
  };
  r.onresult=e=>end(null,Array.from(e.results[0]).map(a=>a.transcript));
  r.onerror=e=>end(e.error||'error');
  r.onend=()=>end('no-speech');
  // Pada sesetengah telefon, pengecaman suara langsung tidak menjawab.
  // Tanpa pengawal masa ini, butang akan terkunci dan pelajar tersekat.
  timer=setTimeout(()=>{try{r.abort()}catch(e){}try{r.stop()}catch(e){}end('timeout')},10000);
  try{r.start()}catch(e){end('error')}
}

  const right=S.res.filter(r=>r.ok).length,total=S.res.length,pct=Math.round(100*right/Math.max(1,total));
  const stars=starsFor(pct),key=S.topic.id+'-'+S.level;
  const pr=prog();const old=pr[key];
  if(!old||pct>old.pct)pr[key]={pct,stars};LS.set('jb_prog',pr);
  const payload={kunci:CFG.kunci||'',masa:new Date().toISOString(),nama:S.user.nama,id:S.user.id,topik:S.topic.id,tahap:S.level,peratus:pct,betul:right,jumlah:total,bintang:stars,
    baca:tally.baca.join('/'),dengar:tally.dengar.join('/'),tulis:tally.tulis.join('/'),cakap:tally.cakap.join('/'),saat:Math.round((Date.now()-S.t0)/1000),bahasa:S.lang};
  S.summary={pct,stars,tally,right,total};S.screen='done';S.sendState='...';render();
  S.sendState=await sendScore(payload);
  const el=$('#sendstate');if(el)el.textContent=sendMsg();
}
const sendMsg=()=>({demo:'Mod percubaan: markah disimpan pada peranti ini sahaja.',sent:'Markah telah dihantar kepada pensyarah.','queued':'Tiada talian. Markah akan dihantar semula apabila anda dalam talian.','...':'Menghantar markah...'}[S.sendState]||'');
function renderDone(){
  const s=S.summary;const nm={baca:'Baca',dengar:'Dengar',tulis:'Tulis',cakap:'Cakap'};
  const bars=Object.keys(nm).map(k=>{const [a,b]=s.tally[k];const w=b?Math.round(100*a/b):0;
    return `<div class="bar2"><span>${nm[k]}</span><i><b style="width:${w}%"></b></i><em>${b?a+'/'+b:'-'}</em></div>`}).join('');
  const kata=s.stars===3?'Hebat!':s.stars===2?'Bagus!':s.stars===1?'Boleh lagi!':'Cuba sekali lagi.';
  app.innerHTML=`
   <div class="bar"><div class="me"><span class="wk" style="margin:0">Tahap ${S.level}</span><b>${esc(S.topic.title)}</b></div>
     <button class="btn ghost sm" data-act="home">Keluar</button></div>
   <div class="score">
     <div class="ring" style="--p:${s.pct}"><b>${s.pct}%</b></div>
     <div class="stars" aria-label="${s.stars} bintang">${'★'.repeat(s.stars)}${'☆'.repeat(3-s.stars)}</div>
     <p>${kata} ${s.right} betul pada percubaan pertama, daripada ${s.total} soalan.</p>
   </div>
   ${bars}
   <div class="note" id="sendstate" role="status">${esc(sendMsg())}</div>
   <div class="row"><button class="btn" data-act="start" data-t="${S.topic.id}" data-l="${S.level}">Main lagi</button>
   ${S.level<3?`<button class="btn blue" data-act="start" data-t="${S.topic.id}" data-l="${S.level+1}">Tahap ${S.level+1}</button>`:''}
   <button class="btn ghost" data-act="home">Pilih topik</button></div>`;
}

/* ---------- Acara ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,q=S.qs[S.i];
  if(a==='lang'){S.lang=el.dataset.v;LS.set('jb_lang',S.lang);render();return}
  if(a==='login'){const nama=$('#nama').value.trim(),id=$('#uid').value.trim();
    if(nama.length<2||id.length<2){$('#loginerr').textContent='Isi nama penuh dan ID pelajar atau emel.';return}
    S.user={nama,id};LS.set('jb_user',S.user);S.screen='home';render();flushQueue();return}
  if(a==='logout'){S.user=null;LS.set('jb_user',null);S.screen='login';render();return}
  if(a==='home'){S.screen='home';render();return}
  if(a==='start'){const t=BANK.topics.find(x=>x.id===el.dataset.t);S.topic=t;S.level=+el.dataset.l;
    S.qs=buildRound(t,S.level);S.n=S.qs.length;S.i=0;S.res=[];S.t0=Date.now();S.screen='play';render();return}
  if(a==='say'){say(q.audio);return}
  if(a==='help'){$('#helptext').innerHTML=esc(q.help);el.remove();return}
  if(a==='reveal'){q.skill='baca';if(!$('#bigtxt'))el.closest('.qcard').querySelector('.ask').insertAdjacentHTML('afterend',`<div class="big" id="bigtxt">${esc(q.reveal)}</div>`);el.remove();return}
  if(a==='pick'){if(S.done)return;const i=+el.dataset.i;lockMcq(i,q);finishAnswer(i===q.a,i===q.a?'Betul!':`Jawapan: <b>${esc(q.opts[q.a])}</b>. ${esc(q.why||'')}`);return}
  if(a==='check'){if(q.type==='type')checkText(q);else if(q.type==='order')checkOrder(q);return}
  if(a==='tile'){const x=order.pool.splice(+el.dataset.k,1)[0];order.ans.push(x);drawOrder();return}
  if(a==='untile'){const x=order.ans.splice(+el.dataset.k,1)[0];order.pool.push(x);drawOrder();return}
  if(a==='reset'){order.pool=order.pool.concat(order.ans);order.ans=[];drawOrder();return}
  if(a==='listen'){listen(q);return}
  if(a==='totype'){toTyping(q);return}
  if(a==='next'){next();return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&S.screen==='play'){
    const q=S.qs[S.i];
    if(S.done){next();return}
    if(q&&q.type==='type'&&document.activeElement&&document.activeElement.id==='ans'){checkText(q)}
  }
});

S.screen=S.user?'home':'login';
render();flushQueue();
window.__JB={buildRound,BANK,S};
})();
</script>
</body>
